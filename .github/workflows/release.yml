# Manual release: Actions -> release -> Run workflow, enter a version like v0.1.0.
# Builds the data from the raw snapshots kept in the "data-snapshots" release
# (checked against data/SOURCES), builds wort.exe, and publishes:
#   wort-<version>-windows.zip   wort.exe + data, unzip and run
#   wort-<version>-unix.tar.gz   source + built data: make && make install
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Get raw snapshots and verify their checksums
        run: |
          mkdir -p data/raw
          gh release download data-snapshots --dir data/raw
          cd data/raw && grep -v '^#' ../SOURCES | awk '{print $3 "  " $1}' | sha256sum -c -

      - run: make data

      - uses: open-watcom/setup-watcom@v1
        with:
          version: "2.0"
      - run: make win32

      - name: Package
        run: |
          mkdir dist
          w=wort-$V-windows
          mkdir $w && cp build/win32/wort.exe build/data/* $w/
          for f in README.md LICENSE; do sed 's/$/\r/' $f > $w/$f.txt; done   # CRLF for old Notepad
          zip -r dist/$w.zip $w
          u=wort-$V-unix
          git archive --prefix=$u/ HEAD | tar x
          mkdir -p $u/build && cp -r build/data $u/build/
          tar czf dist/$u.tar.gz $u

      - name: Publish
        run: |
          stamp=$(head -1 build/data/wort.dat | cut -c2-)
          cat > notes.md <<NOTES
          Data: $stamp.

          - **Windows 98 to 11**: unzip \`wort-$V-windows.zip\`, run \`wort\` in a Command Prompt.
          - **Linux, BSD, macOS**: \`tar xzf wort-$V-unix.tar.gz\`, then \`make && sudo make install\`.

          Code: GPL-3.0-or-later. Data: German Wiktionary (CC BY-SA 4.0, via wiktextract/kaikki.org)
          and OpenThesaurus (LGPL 2.1 or CC BY-SA 4.0).
          NOTES
          gh release create "$V" dist/* --target "$GITHUB_SHA" --title "wort $V" --notes-file notes.md
