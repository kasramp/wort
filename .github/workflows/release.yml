# Manual release: Actions -> release -> Run workflow (on main), enter a version like v0.1.0.
# Downloads today's raw data from upstream (falls back to the newest snapshot in the
# "data-snapshots" release), builds the data and wort.exe, keeps new raw files in
# "data-snapshots", commits their checksums to data/SOURCES, tags that commit and publishes:
#   wort-<version>-windows.zip   wort.exe + data, unzip and run
#   wort-<version>-unix.tar.gz   source + built data: make && make install
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Raw data (upstream, or the newest kept snapshot)
        run: tools/snapshot.sh

      - run: make data

      - name: Keep new raw files and record them in data/SOURCES
        run: |
          new=$(git diff -U0 data/SOURCES | grep '^+[^+]' | cut -c2- | awk '{print "data/raw/" $1}')
          if [ -n "$new" ]; then
            gh release upload data-snapshots $new --clobber
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: snapshots for $V" data/SOURCES
            git push origin HEAD:main
          fi

      - uses: open-watcom/setup-watcom@v1
        with:
          version: "2.0"
      - run: make win32

      - name: Package
        run: |
          mkdir dist
          w=wort-$V-windows
          mkdir $w && cp build/win32/wort.exe build/data/* $w/
          for f in README.md LICENSE; do sed 's/$/\r/' $f > $w/$f.txt; done   # CRLF for old Notepad
          zip -r dist/$w.zip $w
          u=wort-$V-unix
          git archive --prefix=$u/ HEAD | tar x
          mkdir -p $u/build && cp -r build/data $u/build/
          tar czf dist/$u.tar.gz $u

      - name: Publish
        run: |
          stamp=$(head -1 build/data/wort.dat | cut -c2-)
          files=$(for f in data/raw/*; do grep "^${f#data/raw/} " data/SOURCES | awk '{print "- `" $1 "` sha256 `" $3 "`"}'; done)
          cat > notes.md <<NOTES
          Data: $stamp. Raw files (release \`data-snapshots\`):
          $files

          - **Windows 98 to 11**: unzip \`wort-$V-windows.zip\`, run \`wort\` in a Command Prompt.
          - **Linux, BSD, macOS**: \`tar xzf wort-$V-unix.tar.gz\`, then \`make && sudo make install\`.

          Code: GPL-3.0-or-later. Data: German Wiktionary (CC BY-SA 4.0, via wiktextract/kaikki.org)
          and OpenThesaurus (LGPL 2.1 or CC BY-SA 4.0).
          NOTES
          gh release create "$V" dist/* --target "$(git rev-parse HEAD)" --title "wort $V" --notes-file notes.md
